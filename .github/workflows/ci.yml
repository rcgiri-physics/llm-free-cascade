name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# The default GITHUB_TOKEN can be read/write depending on repo settings; the
# test job only needs to read the checkout.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      # Pinned to commit SHAs (tag in the comment) so a moved tag can't swap
      # the action's code out from under us.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
